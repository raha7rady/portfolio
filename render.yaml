services:

  - type: web
    name: portfolio-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: ConnectionStrings__Default
        value: Data Source=/tmp/portfolio.db

      - key: Cors__AllowedOrigin
        sync: false

      - key: Email__SmtpHost
        sync: false

      - key: Email__SmtpPort
        value: "587"

      - key: Email__SmtpUsername
        sync: false

      - key: Email__SmtpPassword
        sync: false

      - key: Email__FromAddress
        sync: false

      - key: Email__ToAddress
        sync: false